<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
        <link rel="stylesheet" type="text/css" href="styles.css">
        
        <title>Word-duh-le</title>
    </head>
    <body>
        <header>
            <div style="display: flex; flex-direction: row; padding: 5px">
                <img id="logo-head" src="public/word-duh-le_logo.png" alt="Word-duh-le logo" width="75px">
                <ul class="nav nav-pills">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="play.html">Play</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="leaderboard.html">Leaderboard</a></div>
                    </li>
                </ul>
            </div>
        </header>

        <main>
            <div id="title">
                <h1>Welcome to Word-duh-le!</h1>
                <h2>Login to play!</h2>
            </div>
            <form method="get" action="play.html">
                <div id="login-input">
                    <div id="username">
                        <label style='padding:11px'>Name:</label>
                        <input type="text" placeholder="Username"/>
                    </div>
                    <div id="password">
                        <label>Password:</label>
                        <input type="password" placeholder="Password"/>
                    </div>
                </div>
                <div id="login-confirm">
                    <button type="submit">Create</button>
                    <button type="submit">Confirm</button>
                </div>
            </form>

            <div id="quote-body">
                <h5>Quote of the day: <span id="quote">"Quit, don't quit. Noodles, don't noodles."</span></h5>
            </div>
        </main>

        <footer>
            <p style="margin: 0;">Joshua Tippetts</p>
            <a href="https://github.com/joshualtippetts/Word-duh-le">Github</a>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    </body>
</html>
