<html lang="en">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
        <title>Word-duh-le</title>
    </head>
    <body>
        <header>
            <img id="logo-head" src="word-duh-le_logo.png" alt="Word-duh-le logo" width="250px">
            <nav id="links">
                <ul>
                    <li class="nav-links"><a href="index.html">Home</a></li>
                    <li class="nav-links"><a href="play.html">Play</a></li>
                    <li class="nav-links"><a href="leaderboard.html">Leaderboard</a></li>
                </ul>
                
            </nav>
            <hr/>
        </header>

        <main>
            (Authentication & Application)
            <h1 id="title">Welcome to Word-duh-le!</h1>
            <p>Please login to play</p>
            <form method="get" action="play.html">
                <div id="login-input">
                    <div id="username">
                        <label style='padding:11px'>Name:</label>
                        <input type="text" placeholder="Username"/>
                    </div>
                    <div id="password">
                        <label>Password:</label>
                        <input type="password" placeholder="Password"/>
                    </div>
                </div>
                <div id="login-confirm">
                    <button type="submit">Create</button>
                    <button type="submit">Confirm</button>
                </div>
            </form>

            <hr/>
            <div>Quote of the day: <span id="quote">"Quit, don't quit. Noodles, don't noodles."</span></div>
        </main>

        <footer>
            <hr/>
            <p>Joshua Tippetts</p>
            <a href="https://github.com/joshualtippetts/Word-duh-le">Github</a>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    </body>
</html>
