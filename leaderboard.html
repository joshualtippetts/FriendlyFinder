<html>
    <body>
        <head>
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
            <link rel="stylesheet" type="text/css" href="styles.css">
            <title>Word-duh-le</title>
        </head>
        <header>
            <div style="display: flex; flex-direction: row; padding: 5px">
                <img id="logo-head" src="word-duh-le_logo.png" alt="Word-duh-le logo" width="75px">
                <ul class="nav nav-pills">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="play.html">Play</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="leaderboard.html">Leaderboard</a></div>
                    </li>
                </ul>
            </div>
            <hr/>
        </header>


        <main>
            <h3 class="subtitle">Daily Leaderboard</h3>
            <table>
                <thead>
                    <th class="table-placement">#</th>
                    <th class="table-player">Player</th>
                    <th class="table-tries">Tries</th>
                </thead>
                <tbody>
                    <tr>
                        <td class="table-placement">1</td>
                        <td class="table-player">John</td>
                        <td class="table-tries">2</td>
                    </tr>
                    <tr>
                        <td class="table-placement">2</td>
                        <td class="table-player">Jane</td>
                        <td class="table-tries">3</td>
                    </tr>
                    <tr>
                        <td class="table-placement">3</td>
                        <td class="table-player">You</td>
                        <td class="table-tries">4</td>
                    </tr>
                </tbody>
            </table>

            <table id="your-stats">
                <thead>
                    <th class="table-placement">#</th>
                    <th class="table-player">Player</th>
                    <th class="table-tries">Tries</th>
                </thead>
                <tbody>
                    <tr>
                        <td class="table-placement">3</td>
                        <td class="table-player">You</td>
                        <td class="table-tries">4</td>
                    </tr>
                </tbody>
            </table>
        </main>

        <footer>
            <hr/>
            <p>Joshua Tippetts</p>
            <a href="https://github.com/joshualtippetts/Word-duh-le">Github</a>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    </body>
